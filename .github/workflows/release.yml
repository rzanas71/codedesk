name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Package (Windows NSIS)
        if: matrix.platform == 'win'
        run: npx electron-builder --win --publish never

      - name: Package (Linux deb + AppImage)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux deb AppImage --publish never

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.deb
            release/*.AppImage
          fail_on_unmatched_files: false
